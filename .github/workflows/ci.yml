name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build web image
        run: docker build --tag miko-pad-web:ci .

      - name: Build API image
        run: docker build --tag miko-pad-api:ci ./backend
